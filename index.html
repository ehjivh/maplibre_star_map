<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MapLibre GL JS 星図ビューア</title>
	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="map"></div>
	<div id="info">
		<h2>ヒッパルコス星図ビューア</h2>
		<p>星の大きさ: 等級（明るさ）</p>
		<p>星の色: B-V色指数（温度）</p>
		<div id="projection-toggle">
			<button id="mercator-btn" class="active">平面図 (Mercator)</button>
			<button id="globe-btn">地球儀 (Globe)</button>
		</div>
		<!-- 等級フィルタースライダー -->
		<div id="magnitude-control">
			<label for="mag-slider">最大等級: <span id="mag-value">6.0</span></label>
			<input id="mag-slider" type="range" min="-1.5" max="6.0" step="0.1" value="6.0">
		</div>
		<!-- 星座線トグル -->
		<div id="constellation-control" style="margin-top: 12px; font-size: 13px; color: #e6e6e6;">
			<label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
				<input type="checkbox" id="constellation-toggle" checked>
				星座線を表示
			</label>
		</div>
	</div>

	<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
	<script src="app.js"></script>
</body>

</html>
